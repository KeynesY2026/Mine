<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>雷暴 · 双人对战扫雷</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="logo">⛔ 雷暴</div>
    <div class="sub">双人对战扫雷 · HTML 优化版</div>
    <div id="lastMoveBar" class="none"><span class="lmicon">⏱</span><span id="lastMoveText">尚未落子</span></div>
    <div id="turnBadge"><span class="dot"></span><span id="turnText">准备</span></div>
  </header>
  <main>
    <div id="boardWrap">
      <div id="mineCounter" class="mine-counter" aria-live="polite" aria-label="棋盘剩余地雷数">
        <span class="mine-counter-title"><span id="mineCounterIcon" aria-hidden="true"></span>雷区剩余</span>
        <strong id="remainMines">--</strong><span class="mine-counter-unit">枚</span>
      </div>
      <div id="boardStage">
        <div id="boardViewport"><div id="board"></div></div>
        <div id="winnerMessage" role="status" aria-live="assertive" aria-atomic="true"></div>
      </div>
    </div>
    <aside>
      <div class="player blue" id="panelBlue">
        <div class="phead"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--blue)"></span>
          <span class="pname">蓝方</span><span class="pkind" id="kindBlue">人类</span></div>
        <div class="scoreline"><span class="score" id="scoreBlue">0</span><span class="scoremax" id="maxBlue"></span></div>
        <div class="bar"><i id="barBlue" style="width:0%"></i></div>
        <div class="bombs" id="bombsBlue" role="img" aria-label="剩余炸弹"></div>
        <div class="pstats"><span id="timeLabelBlue">人类用时</span> <b id="timeBlue">0:00</b> · 回合 <b id="roundBlue">0</b></div>
        <div class="thinking" id="thinkBlue">AI 思考中…</div>
      </div>
      <div class="player red" id="panelRed">
        <div class="phead"><span class="dot" style="width:10px;height:10px;border-radius:50%;background:var(--red)"></span>
          <span class="pname">红方</span><span class="pkind" id="kindRed">强 AI</span></div>
        <div class="scoreline"><span class="score" id="scoreRed">0</span><span class="scoremax" id="maxRed"></span></div>
        <div class="bar"><i id="barRed" style="width:0%"></i></div>
        <div class="bombs" id="bombsRed" role="img" aria-label="剩余炸弹"></div>
        <div class="pstats"><span id="timeLabelRed">AI 用时</span> <b id="timeRed">0:00</b> · 回合 <b id="roundRed">0</b></div>
        <div class="thinking" id="thinkRed">AI 思考中…</div>
      </div>
      <div class="btnrow">
        <button class="primary" id="btnNewGame">新对局</button>
        <button class="toggle bomb" id="btnBomb"><span id="bombButtonLabel">炸弹攻击</span><span id="bombButtonCount" class="bombs bomb-button-inventory" aria-hidden="true"></span><span id="bombButtonCountText" class="visually-hidden"></span></button>
        <button class="toggle" id="btnHint" hidden>概率提示</button>
        <button class="toggle" id="btnCheat" hidden>作弊模式</button>
        <button class="toggle" id="btnExportLog" hidden title="导出的本地 JSON 包含本局真实雷图">导出分析日志</button>
      </div>
      <div id="bombGuide" class="bomb-guide show" aria-live="polite"></div>
      <div class="ctl">
        <div class="ctltitle">设置</div>
        <label>AI 速度 <input type="range" id="rngSpeed" min="1" max="10" value="6"><span class="val" id="speedVal">6</span></label>
        <div class="mineinfo" id="mineInfo"></div>
      </div>
      <div class="ctl">
        <div class="ctltitle">本局规则</div>
        <div class="mineinfo" id="rulesInfo" style="margin-top:0"></div>
      </div>
      <div class="ctl">
        <div class="session-heading">
          <div class="ctltitle">会话统计</div>
          <details class="session-help">
            <summary aria-label="会话统计说明">ⓘ</summary>
            <div class="help-popover" role="note">胜、负、平和总局数只统计当前页面中已结束的对局；正在进行的对局不计入。刷新页面后统计归零。</div>
          </details>
        </div>
        <div class="session">
          <span>🔵 <b id="sessBlue">0</b></span>
          <span>🔴 <b id="sessRed">0</b></span>
          <span>⚖ <b id="sessDraw">0</b></span>
          <span>共 <b id="sessTotal">0</b></span>
        </div>
      </div>
    </aside>
  </main>
  <footer>点开雷 +1 并续回合 · 点开数字或空格换回合 · 落后方可使用炸弹</footer>
</div>

<dialog id="dlgNewGame" class="settings-dialog">
  <div class="dlg-head"><h2>新对局</h2></div>
  <div class="dlg-body">
    <div class="frow">
      <div class="fld"><label for="cfgSize">棋盘大小 (10–99)</label><input type="number" id="cfgSize" min="10" max="99" value="15"></div>
      <div class="fld"><label for="cfgBombs">每人炸弹 (0–99)</label><input type="number" id="cfgBombs" min="0" max="99" value="1"></div>
    </div>
    <div class="fld density-field">
      <div class="density-heading"><label for="cfgPct">雷密度</label><output id="cfgPctValue" for="cfgPct">23%</output></div>
      <input type="range" id="cfgPct" min="10" max="90" value="23" aria-describedby="autoMineSummary">
      <div id="autoMineSummary" class="density-summary">生成 53 枚奇数雷</div>
    </div>
    <div class="settings-options">
      <label><input type="checkbox" id="cfgDisableAiBombs"> 禁用 AI 使用炸弹</label>
    </div>
    <div class="pblock blue">
      <div class="pt">蓝方（先手）</div>
      <div class="prow"><select id="cfgBlueKind"></select></div>
    </div>
    <div class="pblock red">
      <div class="pt">红方</div>
      <div class="prow"><select id="cfgRedKind"></select></div>
    </div>
  </div>
  <div class="dlg-foot">
    <button id="btnNewCancel">取消</button>
    <button class="primary" id="btnNewOk">开始</button>
  </div>
</dialog>

<canvas id="victoryFireworks" aria-hidden="true"></canvas>
<div id="toast"></div>

<script src="js/core.js"></script>
<script src="js/ai-planner.js"></script>
<script src="plugin/ai-config.js"></script>
<script src="js/ai-registry.js"></script>
<script src="js/ai-decision.js"></script>
<script src="js/game-settings.js"></script>
<script src="js/key-sequence.js"></script>
<script src="js/diagnostic-log.js"></script>
<script src="js/victory-celebration.js"></script>
<script src="js/turn-timer.js"></script>
<script src="js/mine-feedback.js"></script>
<script src="js/mine-icons.js"></script>
<script src="js/board-layout.js"></script>
<script src="js/ui.js"></script>
